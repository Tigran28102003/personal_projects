data:
  raw_dir: "make_data/"
  processed_dir: "data/processed/"
  target_col: "log_grp_real"
  min_regions: 80
  start_year: 2005
  end_year: 2023
  rebuild_make_data: false

validation:
  min_train_years: 10
  random_state: 42
  missing_drop_threshold: 0.4
  predict_growth: true

tuning:
  n_trials: 50
  inner_val_years: 2

models:
  missing_drop_threshold: 0.4
  lgbm:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 5
    num_leaves: 31
    min_child_samples: 10
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
  catboost:
    iterations: 500
    learning_rate: 0.05
    depth: 6
    l2_leaf_reg: 3
    random_seed: 42
    verbose: 0
  gpboost:
    num_boost_round: 300
    learning_rate: 0.05
    max_depth: 5
    num_leaves: 31
    random_state: 42
  ridge:
    lambda_grid: [0.01, 0.1, 1, 10, 100, 1000]
    inner_val_years: 2
    random_state: 42
  emb_mlp:
    hidden_sizes: [128, 64]
    dropout: 0.3
    lr: 0.001
    max_epochs: 200
    batch_size: 128
    patience: 20
    weight_decay: 0.0001
    random_state: 42

robustness:
  outlier_region_ids: ["москва", "ханты-мансийский ао", "ямало-ненецкий ао", "сахалинская область"]
  crisis_years:
    crisis_2008: [2008, 2009]
    crisis_2014: [2014, 2015]
    crisis_2020: [2020]
    crisis_2022: [2022, 2023]

shap:
  top_n_features: 15
  n_local_examples: 5
